<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rewordly Settings</title>
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      color: #1f2937;
      font-size: 24px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #374151;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle {
      position: relative;
      width: 50px;
      height: 24px;
      background: #d1d5db;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle.active {
      background: #10b981;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle.active::after {
      transform: translateX(26px);
    }
    .button {
      width: 100%;
      padding: 10px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }
    .button:hover {
      background: #059669;
    }
    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rewordly</h1>
  </div>
  
  <div id="api-key-status">
    <!-- API key status will be dynamically updated -->
  </div>
  
  <div class="form-group">
    <label for="enabledToggle">Enable Extension</label>
    <div class="toggle-container">
      <span>Off</span>
      <div class="toggle" id="enabledToggle"></div>
      <span>On</span>
    </div>
  </div>
  
  <div class="form-group">
    <label for="model">Model</label>
    <select id="model">
      <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
      <option value="gpt-4">GPT-4</option>
      <option value="gpt-4-turbo">GPT-4 Turbo</option>
    </select>
  </div>
  
  <button class="button" id="testApiKey">Test API Key</button>
  <button class="button" id="resetSettings" style="margin-top: 10px; background: #ef4444;">Reset Settings</button>
  
  <script src="popup.js"></script>
</body>
</html>
