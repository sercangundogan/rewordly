<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewordly Settings</title>
  <style>
    body {
      width: 400px;
      min-height: 500px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .header p {
      margin: 8px 0 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .toggle-label {
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 24px;
      background: #d1d5db;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .toggle-switch.active {
      background: #667eea;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .toggle-switch.active::after {
      transform: translateX(26px);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .status.success {
      background: #f0fdf4;
      color: #059669;
      border: 1px solid #10b981;
    }

    .status.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #ef4444;
    }

    .status.info {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #3b82f6;
    }

    .footer {
      padding: 16px 24px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
      text-align: center;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-size: 12px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .api-key-input {
      position: relative;
    }

    .api-key-input input[type="password"] {
      padding-right: 40px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 14px;
    }

    .toggle-password:hover {
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Rewordly</h1>
    <p>Rewrite text with AI-powered clarity</p>
  </div>

  <div class="content">
    <div id="status" class="status hidden"></div>

    <div class="form-group" style="background: #f0fdf4; border: 1px solid #10b981; border-radius: 8px; padding: 12px; margin-bottom: 20px;">
      <div style="display: flex; align-items: center; margin-bottom: 8px;">
        <span style="color: #059669; font-size: 16px; margin-right: 8px;">✅</span>
        <span style="font-weight: 600; color: #059669;">API Key Loaded</span>
      </div>
      <p style="margin: 0; color: #059669; font-size: 12px;">
        Your OpenAI API key is automatically loaded from the .env file. No manual input required.
      </p>
    </div>

    <div class="form-group">
      <label for="model">AI Model</label>
      <select id="model">
        <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Fast & Cost-effective)</option>
        <option value="gpt-4">GPT-4 (Better Quality)</option>
        <option value="gpt-4-turbo">GPT-4 Turbo (Latest)</option>
      </select>
    </div>

    <div class="form-group">
      <div class="toggle-group">
        <span class="toggle-label">Enable Rewordly</span>
        <div class="toggle-switch" id="enabledToggle"></div>
      </div>
    </div>

    <div class="form-group">
      <button type="button" class="btn btn-primary" id="saveBtn">Save Settings</button>
    </div>

    <div class="form-group">
      <button type="button" class="btn btn-secondary" id="testBtn">Test API Key</button>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/your-repo/rewordly" target="_blank">GitHub</a> • 
    <a href="#" id="resetBtn">Reset Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
