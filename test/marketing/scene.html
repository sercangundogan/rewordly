<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rewordly store scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1917; --ink-soft: #44403c; --muted: #78716c;
      --forest: #2a4a3d; --forest-deep: #1e3a30; --amber: #c4713d; --red: #ce2c31;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1024px; height: 640px; overflow: hidden; }
    body {
      position: relative; color: var(--ink); font-family: 'Source Serif 4', Georgia, serif;
      background:
        radial-gradient(880px 520px at 90% 6%, rgba(196, 113, 61, .20), transparent 62%),
        radial-gradient(720px 540px at 0% 104%, rgba(42, 74, 61, .17), transparent 62%),
        #f6f1e8;
    }

    /* Left: copy */
    .copy { position: absolute; left: 56px; top: 50px; bottom: 50px; width: 330px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 11px; font: 600 22px/1 'Fraunces', Georgia, serif; letter-spacing: -.01em; }
    .brand img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 2px 8px rgba(28, 25, 23, .18); }
    .main { margin-top: auto; margin-bottom: auto; padding-bottom: 14px; }
    h1 { margin: 0; font: 700 45px/1.07 'Fraunces', Georgia, serif; letter-spacing: -.015em; }
    h1 .u { white-space: nowrap; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 4px; text-underline-offset: 7px; text-decoration-skip-ink: none; }
    .sub { margin: 22px 0 0; font-size: 18px; line-height: 1.52; color: var(--ink-soft); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .chip { font: 600 13px/1 Inter, system-ui, sans-serif; color: var(--ink-soft); background: #fffefb; border: 1px solid rgba(28, 25, 23, .12); padding: 8px 12px; border-radius: 999px; box-shadow: 0 1px 2px rgba(28, 25, 23, .05); }
    .pill { align-self: flex-start; font: 600 12px/1 Inter, system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #faf7f2; background: var(--forest); padding: 10px 14px; border-radius: 999px; }

    /* Right: a generic compose window the extension works in */
    .stage { position: absolute; left: 404px; top: 64px; width: 580px; }
    .win { background: #fff; border-radius: 16px; box-shadow: 0 44px 90px -34px rgba(28, 25, 23, .5), 0 14px 30px -14px rgba(28, 25, 23, .22), 0 0 0 1px rgba(28, 25, 23, .07); font-family: Inter, system-ui, sans-serif; }
    .bar { height: 42px; display: flex; align-items: center; padding: 0 16px; background: #f7f4ee; border-bottom: 1px solid #ece7de; border-radius: 16px 16px 0 0; position: relative; }
    .dots { display: flex; gap: 8px; }
    .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
    .bar b { position: absolute; left: 0; right: 0; text-align: center; font: 500 13px/1 Inter, sans-serif; color: #6b6560; pointer-events: none; }
    .row { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 22px; border-bottom: 1px solid #f0ece5; font-size: 14px; color: var(--ink); }
    .row span { width: 56px; color: #a39e97; font-size: 13px; }
    .body { padding: 18px 22px 20px; min-height: 268px; font-size: 17px; line-height: 1.62; color: #1f1d1b; outline: none; caret-color: #1f1d1b; }
    .body p { margin: 0 0 12px; }
    .foot { height: 58px; padding: 0 18px; border-top: 1px solid #f0ece5; display: flex; align-items: center; justify-content: space-between; border-radius: 0 0 16px 16px; }
    .send { background: var(--forest); color: #fff; font: 600 14px/1 Inter, sans-serif; padding: 11px 22px; border-radius: 10px; }
    .saved { color: #a39e97; font-size: 13px; }

    /* Scene 5: the extension popup */
    .popup-stage { position: absolute; left: 540px; top: 50%; transform: translateY(-50%); }
    .popup-stage img { display: block; width: 352px; border-radius: 18px; box-shadow: 0 44px 90px -30px rgba(28, 25, 23, .55), 0 14px 30px -14px rgba(28, 25, 23, .25), 0 0 0 1px rgba(28, 25, 23, .1); }

    /* A visible mouse pointer: screenshots don't contain the real one. */
    #cursor { position: fixed; left: -40px; top: -40px; width: 22px; height: 30px; pointer-events: none; z-index: 2147483647; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); display: none; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="/logo.png" alt="">Rewordly</div>
    <div class="main"><h1 id="h"></h1><p class="sub" id="sub"></p><div class="chips" id="chips"></div></div>
    <div class="pill">Free to start · No account needed</div>
  </div>
  <div class="stage" id="stage">
    <div class="win">
      <div class="bar"><div class="dots"><i></i><i></i><i></i></div><b id="title">New message</b></div>
      <div class="row"><span>To</span>maria@example.com</div>
      <div class="row"><span>Subject</span><i id="subject" style="font-style:normal"></i></div>
      <div class="body" id="body" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Message body"></div>
      <div class="foot"><div class="send">Send</div><div class="saved">Draft saved</div></div>
    </div>
  </div>
  <div class="popup-stage" id="popup" hidden><img id="popupImg" src="/generated/popup.png" alt=""></div>
  <svg id="cursor" viewBox="0 0 22 30" xmlns="http://www.w3.org/2000/svg"><path d="M2 2 L2 24 L7.6 19 L11.4 27.6 L15 26 L11.2 17.6 L18.6 17.4 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>

  <script>
    const SCENES = {
      1: {
        h: 'Catch <span class="u">mistakes</span> as you type.',
        sub: 'Rewordly underlines spelling and grammar errors right where you write, on almost any website.',
        subject: 'Re: Project proposal',
        body: '<p>Hi Maria,</p><p>Thanks for sending the proposal over. I have read it twice and I think the timeline is realistic, but their are a few things I would like to discuss befor we sign.</p><p>Could we meet on Thursday to go trough the budget? I dont want to delay the launch.</p><p>Best,<br>Alex</p>',
      },
      2: {
        h: 'See the fix. <span class="u">One click.</span>',
        sub: 'Hover an underline to see what is wrong and why, then apply the suggestion without leaving the page.',
        subject: 'Re: Project proposal',
        body: '<p>Hi Maria,</p><p>Thanks for sending the proposal over. I have read it twice and I think the timeline is realistic, but their are a few things I would like to discuss befor we sign.</p><p>Could we meet on Thursday to go trough the budget? I dont want to delay the launch.</p><p>Best,<br>Alex</p>',
      },
      3: {
        h: 'Every language, <span class="u">automatically.</span>',
        sub: 'Each sentence is checked in its own language. Write the way you do, with nothing to switch.',
        chips: ['English', 'Español', 'Deutsch', 'Türkçe', 'Français'],
        subject: 'Quick update',
        body: '<p>Thanks for the quick reply, I will send the files tomorow.</p><p>Gracias por la información, nos vemos mañana en la reunion.</p><p>Ich schike dir morgen die Datei, danke für deine Geduld.</p><p>Sunumu akşam gönderecegim, toplantıya yetişirim.</p><p>Je suis desolé pour le retard, je t\'envoie le document ce soir.</p>',
      },
      4: {
        h: 'Rewrite in <span class="u">one click.</span>',
        sub: 'Select any text and let AI make it clearer, shorter or more polished, then drop it back in place.',
        subject: 'Report',
        body: '<p>Hi team,</p><p id="pick">hey, just wanted to say the report is kinda late, sorry about that, will send it soon</p><p>Thanks,<br>Alex</p>',
      },
      5: {
        h: 'You stay in <span class="u">control.</span>',
        sub: 'Turn live checking on or off, see what is left of your free allowance, and go Pro for unlimited checks.',
        popup: true,
      },
    };
    const scene = SCENES[new URLSearchParams(location.search).get('s') || 1];
    document.getElementById('h').innerHTML = scene.h;
    document.getElementById('sub').textContent = scene.sub;
    document.getElementById('chips').innerHTML = (scene.chips || []).map((c) => '<span class="chip">' + c + '</span>').join('');
    if (scene.popup) {
      document.getElementById('stage').hidden = true;
      document.getElementById('popup').hidden = false;
    } else {
      document.getElementById('subject').textContent = scene.subject;
      document.getElementById('body').innerHTML = scene.body;
    }
    if (new URLSearchParams(location.search).get('cursor')) {
      const cursor = document.getElementById('cursor');
      cursor.style.display = 'block';
      addEventListener('pointermove', (e) => { cursor.style.left = e.clientX - 2 + 'px'; cursor.style.top = e.clientY - 2 + 'px'; }, true);
    }
  </script>
</body>
</html>
